name: Generate Bomberman animation

on:
  schedule: # 每 8 小时跑一次
    - cron: "43 6,14,22 * * *"

  workflow_dispatch: # 允许在 Actions 页面手动触发

  push:
    branches:
      - main
    paths:
      - .github/workflows/bomberman.yml # 改这个文件时顺带跑一次

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write # 必须有，否则推不了 output 分支
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Bomberman contribution graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: bomberman
          # 配了 GH_PAT secret 就用它（能统计私有仓库贡献），没配就退回默认 token
          github_token: ${{ secrets.GH_PAT || github.token }}

      - name: Publish Bomberman SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
