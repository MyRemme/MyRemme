name: Generate all arcade animations

on:
  schedule:
    - cron: "43 6,14,22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-all.yml

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate arcade contribution graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # 可选游戏: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "bomberman,pacman,breakout,galaga,puzzle-bobble,minesweeper"
          player_style: opportunistic # 仅 pacman 生效: opportunistic / conservative / aggressive
          hide_month_labels: "false" # true = 去掉网格上方的月份标签
          # 配了 GH_PAT secret 就用它（能统计私有仓库贡献），没配就退回默认 token
          github_token: ${{ secrets.GH_PAT || github.token }}

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
